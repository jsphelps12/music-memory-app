# Create one moment and wait for its card. Copied from smoke.yaml; keep in
# step (except the capture tap, below). The card wait only proves the new
# moment on an empty account (reset script), so callers still start empty.
appId: com.joshuaphelps.musicmemory.preview
env:
  SONG_QUERY: "Bohemian Rhapsody"
  REFLECTION: "e2e actions reflection"
---
# --- Create a moment ---------------------------------------------------------
- waitForAnimationToEnd
# The floating "+" (id: tab-create), so the subflow works whether or not the
# Journal already has moments. It used to overflow the custom tab bar, which
# clipped its accessibility frame and made XCUITest's element tap miss; it now
# sits in its own layer whose bounds contain it (components/TabBar.tsx).
# smoke.yaml still taps the empty Journal's button, which also proves the
# empty state renders on a fresh account.
- tapOn:
    id: "tab-create"

# The create screen doesn't open song search itself — its "Search" pill
# (components/SongPickerSection.tsx) pushes /song-search. Waiting for it also
# confirms the create screen actually opened.
- extendedWaitUntil:
    visible:
      id: "create-select-song"
    timeout: 10000
- tapOn:
    id: "create-select-song"

- extendedWaitUntil:
    visible:
      id: "song-search-input"
    timeout: 10000
- tapOn:
    id: "song-search-input"
- waitForAnimationToEnd
- inputText: ${SONG_QUERY}
# Distinguishes "the query never reached the app" from "the catalog returned
# nothing" — the two look identical downstream (no result 0), but only the
# second is a real failure. The keyboard tutorial suppressed in e2e.yml caused
# the first and read as the second for an entire debugging pass.
# Exact text again. It was loosened to a prefix regex after CI typed "Bohemian
# Rhapysod", but the next run typed "Bdy": the input was CONTROLLED, and a
# stale value from a JS thread busy re-rendering results overwrote keystrokes.
# That's an app race, not test noise, so the input is now uncontrolled and the
# exact check guards it.
- assertVisible:
    id: "song-search-input"
    text: ${SONG_QUERY}
# The search is debounced 275ms and hits the Apple Music catalog over the
# network, so the first result needs a real timeout, not the default.
- extendedWaitUntil:
    visible:
      id: "song-search-result-0"
    timeout: 20000
- tapOn:
    id: "song-search-result-0"

- tapOn:
    id: "create-reflection"
- inputText: ${REFLECTION}
# Save lives in the top bar (Phase 1 capture redesign), above the keyboard,
# so there's no keyboard to dismiss first.
- tapOn:
    id: "create-save"

# --- Assert it landed on the timeline ----------------------------------------
- extendedWaitUntil:
    visible:
      id: "moment-card-title"
    timeout: 30000
