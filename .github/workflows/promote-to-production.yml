name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to promote (defaults to the head of the selected branch)
        required: false
        default: ""
      message:
        description: Release note (shown in EAS update history)
        required: false
        default: Promote to production

permissions:
  contents: read
  # Required to read the E2E Smoke commit status for the commit being promoted.
  statuses: read

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    name: OTA → production channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinning to a SHA means you promote the commit you actually reviewed and
      # tested on beta, not whatever main happened to be when you clicked Run.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Report what is being promoted
        run: |
          echo "Promoting $(git rev-parse HEAD)"
          git log -1 --format='%s (%an, %ci)'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The E2E smoke flow must have passed on THIS exact commit's JS, not
      # merely at some point on main. E2E Smoke posts the commit status
      # "e2e-smoke/embedded-js" on the commit it built and tested (see
      # e2e.yml); a run's head_sha is not enough, since a dispatch records the
      # branch head there whatever commit it was asked to test. The newest
      # status wins, so a later red run on the same commit blocks again.
      - name: Require a passing E2E run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A dispatch input reaches a URL path here; anything but a hex SHA
          # could change what is being asked.
          if ! printf '%s' "$TARGET_SHA" | grep -qE '^[0-9a-f]{7,40}$'; then
            echo "::error::sha input is not a valid commit SHA: $TARGET_SHA"
            exit 1
          fi
          # The status is keyed by the full SHA; this checkout is the commit.
          FULL_SHA=$(git rev-parse HEAD)
          # Statuses come newest first, so the first page holds the latest
          # one. Only statuses this repo's Actions posted count.
          LATEST=$(gh api "repos/$REPO/commits/$FULL_SHA/statuses?per_page=100" \
            --jq '[.[] | select(.context == "e2e-smoke/embedded-js" and .creator.login == "github-actions[bot]")] | .[0].state // ""')
          if [ "$LATEST" != "success" ]; then
            echo "::error::No passing E2E Smoke result for $FULL_SHA (latest: ${LATEST:-none}). Run the 'E2E Smoke' workflow with sha=$FULL_SHA before promoting."
            exit 1
          fi
          echo "E2E Smoke passed on $FULL_SHA."

      # runtimeVersion is "fingerprint", so EAS itself will never serve this
      # bundle to a binary built from different native code — the crash case is
      # gone, and there is nothing left worth bypassing (hence no skip input).
      #
      # What remains is publishing into the void: a mismatched update is
      # accepted, reported as published, and delivered to nobody. That is silent
      # and looks exactly like success, so the gate now asks whether any live
      # build actually serves this runtime version.
      - name: Verify a live production build serves this runtime version
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/fingerprint-gate.mjs --profile production

      # `--environment production` pulls EXPO_PUBLIC_* from the EAS production
      # environment, so this bundle and the production binary are built from one
      # source of truth. EXPO_PUBLIC_APP_ENV stays explicit — it comes from
      # eas.json's build profile, which `eas update` does not read.
      - name: Publish OTA update (production channel)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          RELEASE_MESSAGE: ${{ inputs.message }}
        run: |
          npx eas-cli@25.2.0 update --branch production --environment production \
            --message "$RELEASE_MESSAGE" --non-interactive

      # Without this, every JS error from an OTA bundle lands in Sentry
      # minified. Runs after publishing and never fails the job: the export is
      # deterministic for a given commit + env, so re-exporting here produces
      # the same bundle that was just published.
      - name: Upload sourcemaps to Sentry
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_APP_ENV: production
          SENTRY_ORG: soundtracks
          SENTRY_PROJECT: react-native
        run: |
          npx eas-cli@25.2.0 env:exec production \
            "npx expo export --platform ios --output-dir dist && npx sentry-expo-upload-sourcemaps dist" \
            --non-interactive
