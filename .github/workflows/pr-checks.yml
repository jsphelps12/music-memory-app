name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — type-check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Deliberately not an npm script: package.json's scripts block feeds the
      # native fingerprint, and adding a line there strands installed binaries.
      - name: Type check edge functions
        run: npx tsc -p supabase/functions

      - name: Lint
        run: npm run lint

      # The design system's guardrail (DESIGN.md, Components): no uppercase
      # labels, pure colors, literal fonts, terracotta fills or glyph icons.
      # Not an npm script, for the same fingerprint reason as above.
      - name: Design lint
        run: node scripts/design-lint.mjs

      - name: Test
        run: npm test

  web:
    name: Web — type-check, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
