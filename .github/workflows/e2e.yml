name: E2E Smoke

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to test
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to test (defaults to the head of the selected branch)
        required: false
        default: ""
  schedule:
    # Weekly, Monday 09:00 UTC. Catches rot in the staging account, the Apple
    # Music catalog search, and Supabase auth without waiting for a promote.
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  # Serialized: every run resets the same staging account, so two at once would
  # delete each other's moment mid-flow.
  group: e2e-smoke
  cancel-in-progress: false

jobs:
  # Find a simulator build whose archive can still be downloaded, building one
  # if there isn't. Separate from the smoke job so a long EAS queue waits on a
  # Linux runner with a generous timeout instead of eating the smoke job's.
  resolve-build:
    name: Resolve simulator build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      url: ${{ steps.build.outputs.url }}
      sha: ${{ steps.build.outputs.sha }}
      exact: ${{ steps.build.outputs.exact }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Which binary runs decides which JS runs: the smoke job turns OTA
      # updates off in the installed app, so it always runs the JS bundle
      # embedded at build time.
      #
      # Commit runs (dispatch, workflow_call): the build must come from the
      # tested commit itself (EAS records gitCommitHash), so the flow runs that
      # commit's JS and the commit status it posts can vouch for it. If no such
      # build exists, one is built from this checkout. That is one EAS build per
      # promoted commit (~15 minutes with an empty queue); cutting the
      # preview-simulator build from the release commit via "Binary Build"
      # saves the wait.
      #
      # Scheduled runs only watch for rot (staging account, catalog search,
      # auth), so they reuse the newest build and never post a status.
      #
      # EAS deletes build archives after a retention window, though, and a
      # deleted archive still shows up in build:list as "finished". The cron
      # 404'd on one every week from Aug to Oct 2026. So check that the archive
      # is still downloadable, and build a fresh one when it isn't.
      - name: Find or build a downloadable simulator build
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXACT: ${{ github.event_name != 'schedule' }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # First build in the list (optionally the first whose commit is
          # $1) that has an archive URL.
          pick_url() {
            node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const want=process.argv[1]||'';const b=JSON.parse(s).find(b=>b&&b.artifacts&&b.artifacts.buildUrl&&(!want||b.gitCommitHash===want));console.log(b?b.artifacts.buildUrl:'')})" "${1:-}"
          }
          if [ "$EXACT" = "true" ]; then
            URL=$(npx eas-cli@25.2.0 build:list --platform ios --profile preview-simulator \
              --status finished --limit 50 --json --non-interactive | pick_url "$SHA")
          else
            URL=$(npx eas-cli@25.2.0 build:list --platform ios --profile preview-simulator \
              --status finished --limit 1 --json --non-interactive | pick_url)
          fi
          # A one-byte range read, not HEAD: it follows the same redirect a
          # real download does, and some storage backends reject HEAD.
          if [ -n "$URL" ] && curl -fsSL --max-time 60 -r 0-0 -o /dev/null "$URL"; then
            echo "Reusing $URL"
          else
            if [ "$EXACT" = "true" ]; then
              echo "::notice::No downloadable preview-simulator build of $SHA. Building one from this commit."
            else
              echo "::notice::No downloadable preview-simulator build (archive missing or expired). Building one."
            fi
            URL=$(npx eas-cli@25.2.0 build --platform ios --profile preview-simulator \
              --wait --json --non-interactive | pick_url)
            if [ -z "$URL" ]; then
              echo "::error::The preview-simulator build finished without an archive URL."
              exit 1
            fi
          fi
          {
            echo "url=$URL"
            echo "sha=$SHA"
            echo "exact=$EXACT"
          } >> "$GITHUB_OUTPUT"

  smoke:
    name: Maestro smoke flow (iOS simulator)
    needs: resolve-build
    runs-on: macos-latest
    timeout-minutes: 45
    # statuses: write is for the commit status promote-to-production checks.
    # A workflow that calls this one (workflow_call) must grant it too.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and unpack the app
        env:
          # Via env rather than inline ${{ }} so the value is never spliced into
          # the shell command text.
          BUILD_URL: ${{ needs.resolve-build.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL -o build.tar.gz "$BUILD_URL"
          mkdir -p build && tar -xzf build.tar.gz -C build
          echo "APP_PATH=$(find build -name '*.app' -maxdepth 2 | head -1)" >> "$GITHUB_ENV"

      # The flow must run the JS embedded in this binary (built from the
      # tested commit), not whatever preview OTA is newest. clearState wipes a
      # downloaded update, but the app fetches one in the background on launch
      # and the flow's stopApp/launchApp would then cold-start into it. With
      # expo-updates disabled the app launches the embedded bundle and never
      # checks for updates.
      - name: Pin the app to its embedded JS
        run: |
          set -euo pipefail
          PLIST="$APP_PATH/Expo.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::$PLIST not found; can't disable OTA updates, so the flow could run a different commit's JS."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :EXUpdatesEnabled false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :EXUpdatesEnabled bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :EXUpdatesEnabled" "$PLIST"
          # Editing a file breaks the bundle's ad-hoc seal; re-sign ad hoc,
          # keeping the entitlements (keychain, app group) the build was
          # signed with.
          if codesign -d "$APP_PATH" >/dev/null 2>&1; then
            codesign --force --sign - --preserve-metadata=identifier,entitlements,flags "$APP_PATH"
          fi

      - name: Boot simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl create e2e-iphone com.apple.CoreSimulator.SimDeviceType.iPhone-16)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # iOS shows a one-time "slide your finger across the letters" tutorial the
      # first time a STANDARD keyboard appears. Sign-in doesn't trigger it (an
      # email-address keyboard has no QuickPath), so it lands on the first plain
      # text field the flow reaches — song search — and swallows the text: the
      # native field shows the query while the app's onChangeText never fires,
      # leaving the screen on its idle hint and never searching.
      # It cannot be dismissed from the flow: it renders in the keyboard's own
      # process, so it never appears in the app's accessibility hierarchy (the
      # trick the flow uses for the Apple Account and Save Password alerts does
      # not reach it) while still blanking everything behind it. CI creates a
      # fresh simulator per run, so mark it seen before anything launches.
      - name: Suppress the simulator keyboard tutorial
        run: |
          set -euo pipefail
          for domain in com.apple.Preferences com.apple.keyboard.preferences; do
            xcrun simctl spawn "$SIM_UDID" defaults write "$domain" \
              DidShowContinuousPathIntroduction -bool true
          done

      - name: Install app
        run: xcrun simctl install "$SIM_UDID" "$APP_PATH"

      # Must run after install and before the flow: the flow's final assertion
      # is only meaningful against an account with no pre-existing moments.
      - name: Reset the staging E2E account
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: node scripts/seed-e2e.mjs

      - name: Install Maestro
        env:
          # PINNED ON PURPOSE. The installer takes the newest release when this
          # is unset, which silently swapped 2.7.0 → 2.8.0 mid-life (2.8.0 was
          # published 2026-07-31 12:04 UTC, six hours after the last green run)
          # and broke every run after it: 2.8.0 starts typing before the
          # keyboard it just raised has settled, so the FIRST inputText of a
          # flow lands only its first character. The email field got "e", auth
          # failed, and the flow died 20 steps later on "tab-create is visible"
          # — a failure that reads like an app regression and isn't one.
          # An unpinned test runner cannot tell you the app broke.
          # Bump deliberately, and re-run this workflow when you do.
          MAESTRO_VERSION: 2.7.0
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # One retry, ONLY when Maestro's XCTest driver itself died. On 2026-10-17
      # a run lost the driver mid-sign-in ("Transport unreachable while
      # processing eraseText"): the flow
      # never reached the app's code, and the same steps pass on other runs.
      # An assertion failure is the app's problem and still fails on the first
      # try; only the driver-death signature earns a second attempt, after
      # resetting the staging account the first attempt may have written to.
      - name: Run smoke flow
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          run_flow() {
            maestro test .maestro/smoke.yaml \
              --env E2E_PASSWORD="$E2E_PASSWORD" \
              --format junit --output maestro-report.xml 2>&1 | tee maestro-run.log
          }
          run_flow
          code=$?
          # The driver error only reaches Maestro's debug log, not stdout
          # (stdout said just "[Failed] smoke (3m 28s)"), so search both. Match
          # "Transport unreachable" ONLY: "Failed to connect to /127.0.0.1"
          # also appears in every genuine assertion failure's log (driver
          # startup/teardown), and retrying those would hide real regressions.
          if [ "$code" -ne 0 ] && grep -rq "Transport unreachable" maestro-run.log "$HOME/.maestro/tests" 2>/dev/null; then
            echo "::warning::Maestro's XCTest driver died mid-flow (test infrastructure, not the app). Resetting the account and retrying once."
            node scripts/seed-e2e.mjs
            run_flow
            code=$?
          fi
          exit "$code"

      # promote-to-production checks this status, not the run's head_sha:
      # a dispatch records the selected branch head as head_sha whatever the
      # sha input was, and a scheduled run tests a reused binary. The status
      # goes on the commit this run checked out and built, and only on commit
      # runs. A failure is posted too, so a later red run on the same commit
      # supersedes an earlier green one.
      - name: Record the result on the tested commit
        if: (success() || failure()) && needs.resolve-build.outputs.exact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-build.outputs.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context="e2e-smoke/embedded-js" \
            -f description="Maestro smoke flow on a simulator build of this commit" \
            -f target_url="$RUN_URL" >/dev/null
          echo "Posted $STATE for $SHA"

      - name: Upload Maestro artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          retention-days: 7

      - name: Tear down simulator
        if: always()
        run: xcrun simctl delete "$SIM_UDID" || true
