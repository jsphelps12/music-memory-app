      - { at: 3.4, text: "Front row. Finally." }
      - { at: 6.07, text: "So you don't" }
    caption: "Best concert of your life, go."

  - id: knew
    layout: full
    palette: light
    segments:
      - { shot: search-knew, from: 1.0, to: 2.2 }
      - { shot: search-knew, from: 12.0, to: 14.2 }
      - { shot: search-knew, from: 18.8, to: 23.0, speed: 1.2 }
      - { shot: search-knew, from: 23.0, to: 24.6, zoom: 1.3, focus: [0.5, 0.2] }
    beats:
      - { at: 0, text: "The song playing\nthe night you knew", y: 1050 }
      - { at: 3.4, text: "Feet in the water, singing it badly" }
      - { at: 6.9, text: "Write it down before it fades" }
    caption: "What was playing the night you knew?"

  - id: roommates
    layout: full
    palette: light
    segments:
      - { shot: search-roommates, from: 1.0, to: 2.2 }
      - { shot: search-roommates, from: 10.0, to: 12.2 }
      - { shot: search-roommates, from: 17.9, to: 21.4, speed: 1.2 }
      - { shot: search-roommates, from: 21.4, to: 23.0, zoom: 1.3, focus: [0.5, 0.2] }
    beats:
      - { at: 0, text: "Old roommates.\nOne song.", y: 1050 }
      - { at: 3.4, text: "Twenty again for four minutes" }
      - { at: 6.32, text: "Tag the one this song belongs to" }
    caption: "Tag the person this song belongs to."

  # ── Re-cuts of earlier footage in the other layout.
  - id: wedding-phone
    layout: phone
    palette: light
    segments:
      - { shot: open-moment, from: 0, to: 1.4 }
      - { shot: open-moment, from: 1.6, to: 4.6, speed: 1.2 }
      - { shot: open-moment, from: 5.0, to: 6.8 }
      - { shot: open-moment, from: 13.6, to: 15.6 }
    beats:
      - { at: 0, text: "Your wedding song\ndeserves a story" }
      - { at: 2.2, text: "Not just a playlist" }
      - { at: 5.7, text: "What it meant. Who was there." }
    caption: "What was your first dance?"

  - id: people-search
    layout: phone
    palette: light
    segments:
      - { shot: rediscover-search, from: 0.5, to: 1.7 }
      - { shot: rediscover-search, from: 9.6, to: 11.8 }
      - { shot: rediscover-search, from: 15.6, to: 20.6, speed: 1.25 }
    beats:
      - { at: 0, text: "Search a person.\nGet the songs back." }
      - { at: 3.4, text: "Every summer in Dad's truck" }
