  - id: capture-phone
    layout: phone
    palette: light
    segments:
      - { shot: capture, from: 0.2, to: 1.6 }
      - { shot: capture, from: 10.0, to: 11.8 }
      - { shot: capture, from: 14.8, to: 16.2 }
      - { shot: capture, from: 18.0, to: 21.2, speed: 1.3 }
      - { shot: capture, from: 24.8, to: 26.8 }
    beats:
      - { at: 0, text: "Hear it. Save it.\nKeep it forever." }
      - { at: 1.4, text: "The song" }
      - { at: 4.6, text: "One line is enough" }
      - { at: 7.1, text: "Find it in ten years" }
