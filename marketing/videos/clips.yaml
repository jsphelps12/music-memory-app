  - id: scroll-pov
    layout: full
    palette: light
    segments:
      - { shot: journal-scroll, from: 0, to: 1.4 }
      - { shot: journal-scroll, from: 3.0, to: 24.0, speed: 3.5 }
      - { shot: journal-scroll, from: 24.5, to: 26.5 }
    beats:
