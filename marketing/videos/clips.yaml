# Short videos for TikTok / Reels / Shorts, built from recorded shots of the
# app (marketing/videos/flows/<shot>.yaml) with scripts/video/make.py.
#
# Two kinds of clip:
#
# STORY (what we post): `slides`, in order. A slide is a real-life photo
# (`photo:` a file in photos/, `seconds:`) or a piece of a shot (`shot:` with
# from/to/speed/zoom/focus as below), each with its `text`. The format faceless
# app accounts use: life first, a specific mid-story line in TikTok's own
# caption look (white, black outline, upper middle, casual lowercase), the app
# as the payoff, its name on the last slide. No end card. Also exports the
# slides as JPGs (out/<id>-slides/) for a Photo Mode carousel.
#
# MONTAGE (the first attempt, kept for reference): `segments` cut together
# with caption beats over them, then an end card.
#
#   id:        output name (marketing/videos/out/<id>.mp4 / .jpg / .txt)
#   layout:    phone (the screen in a bezel under a serif headline) or full
#              (the screen fills the frame, captions as pills on top)
#   palette:   light | dark (the shots record in that appearance too)
#   segments:  the cuts, in order. Each:
#                shot:  flow to record (or input: a recording of your own,
#                       e.g. from your phone, with trim: seconds to skip)
#                from / to: seconds into the shot, counted from when it
#                       starts moving (default: all of it)
#                speed: playback speed (default 1)
#                zoom:  punch in (1 = whole screen, 1.6 = 60% closer)
#                focus: [x, y] point to zoom on, 0–1 across/down the screen
#              A clip without segments uses `shot` (and `speed`) whole.
#   beats:     headline text over time; `at` is seconds into the clip. The
#              first is the hook (bigger). Keep each to a few words.
#   caption_y: full layout: where the caption pills sit, px from the top of
#              the 1920 frame (default 420; ~1380 sits over the keyboard).
#              A beat can set its own `y`.
#
# Zoom only on photos: any punch-in on a text screen crops the words.
#   caption:   post text, written to <id>.txt with the hashtags.
#
# The videos are silent on purpose: add the song from the platform's own
# sound library when you post (a song baked into the upload can get muted).

hashtags: "#musicjournal #nostalgia #songsthatremindme #journaling #iphoneapps"
end_card:
  title: "Soundtracks"
  line: "Free on the App Store"
  seconds: 2

clips:
  - id: wedding
    slides:
      - { photo: wedding-1, seconds: 2.6, text: "every wedding ends with mr. brightside and you know it" }
      - { photo: wedding-2, seconds: 2.0, text: "the whole room screaming the second verse" }
      - { shot: open-moment, from: 1.6, to: 4.4, text: "now the song lives with the photos" }
      - { shot: open-moment, from: 5.0, to: 6.8, text: "it's called soundtracks\n(free on iphone)" }
    caption: "what's the song that ends every wedding you go to?"

  - id: snow
    slides:
      - { photo: cabin-2, seconds: 2.6, text: "some songs only sound right when it's snowing" }
      - { photo: cabin-1, seconds: 2.0, text: "holocene, 7am, everyone else still asleep" }
      - { shot: search-snow, from: 18.0, to: 20.6, text: "saved the exact morning it belonged to" }
      - { shot: search-snow, from: 21.8, to: 23.6, text: "it's called soundtracks\n(free on iphone)" }
    caption: "which song sounds like winter to you?"

  - id: festival
    slides:
      - { photo: festival-2, seconds: 2.6, text: "the song you lose your voice to on day three" }
      - { photo: festival-1, seconds: 2.0, text: "no voice left. worth it." }
      - { shot: search-festival, from: 18.7, to: 21.2, text: "saved with the photos and who was there" }
      - { shot: search-festival, from: 22.5, to: 24.3, text: "it's called soundtracks\n(free on iphone)" }
    caption: "what's the song you lost your voice to?"

  - id: last-night
    slides:
      - { photo: bonfire-2, seconds: 2.6, text: "last night of the trip before your best friend moves away" }
      - { photo: bonfire-1, seconds: 2.0, text: "nobody said it. everybody just sang louder." }
      - { shot: search-denver, from: 17.9, to: 20.4, text: "rivers and roads. kept forever." }
      - { shot: search-denver, from: 20.4, to: 22.2, text: "it's called soundtracks\n(free on iphone)" }
    caption: "what song do you associate with a goodbye?"

  - id: front-row
    slides:
      - { photo: concert-1, seconds: 2.4, text: "front row. finally." }
      - { photo: concert-2, seconds: 2.0, text: "everlong live is a religious experience" }
      - { shot: search-front-row, from: 29.8, to: 32.4, text: "some nights you never want to forget" }
      - { shot: search-front-row, from: 33.3, to: 35.1, text: "it's called soundtracks\n(free on iphone)" }
    caption: "best concert of your life, go."

  - id: the-night-you-knew
    slides:
      - { photo: lake-1, seconds: 2.8, text: "the song playing the night you knew" }
      - { shot: search-knew, from: 18.8, to: 21.6, text: "feet in the water, singing the whistling part badly" }
      - { shot: search-knew, from: 21.6, to: 23.6, text: "it's called soundtracks\n(free on iphone)" }
    caption: "what was playing the night you knew?"

  - id: roommates
    slides:
      - { photo: rooftop-1, seconds: 2.8, text: "old roommates. one night back in the city." }
      - { shot: search-roommates, from: 17.9, to: 20.7, text: "someone put on ribs and everyone was twenty again" }
      - { shot: search-roommates, from: 20.7, to: 22.7, text: "it's called soundtracks\n(free on iphone)" }
    caption: "tag the person this song belongs to"

  - id: dads-truck
    slides:
      - { photo: truck-1, seconds: 2.6, text: "the song from your dad's truck every summer" }
      - { shot: rediscover-search, from: 10.4, to: 12.4, y: 1100, text: "type \"dad\"" }
      - { shot: rediscover-search, from: 16.4, to: 19.4, text: "and every summer comes back" }
      - { shot: rediscover-search, from: 19.4, to: 21.2, text: "it's called soundtracks\n(free on iphone)" }
    caption: "what song does your dad turn up every time?"

  - id: how-it-works
    slides:
      - { photo: vinyl-1, seconds: 2.4, text: "you hear a song and you're 17 again" }
      - { shot: capture, from: 10.8, to: 12.6, y: 1180, text: "pick the song" }
      - { shot: capture, from: 18.0, to: 21.2, speed: 1.3, y: 940, text: "write one line about it" }
      - { shot: capture, from: 25.6, to: 27.4, y: 330, text: "it's called soundtracks\n(free on iphone)" }
    caption: "what song takes you back instantly?"
