# Short videos for TikTok / Reels / Shorts, built from recorded shots of the
# app (marketing/videos/flows/<shot>.yaml) with scripts/video/make.py.
#
# A clip is one or more segments cut together, headline beats over them, then
# an end card. Aim for 8–12 seconds: a big hook in the first second, a payoff
# by the end.
#
#   id:        output name (marketing/videos/out/<id>.mp4 / .jpg / .txt)
#   layout:    phone (the screen in a bezel under a serif headline) or full
#              (the screen fills the frame, captions as pills on top)
#   palette:   light | dark (the shots record in that appearance too)
#   segments:  the cuts, in order. Each:
#                shot:  flow to record (or input: a recording of your own,
#                       e.g. from your phone, with trim: seconds to skip)
#                from / to: seconds into the shot, counted from when it
#                       starts moving (default: all of it)
#                speed: playback speed (default 1)
#                zoom:  punch in (1 = whole screen, 1.6 = 60% closer)
#                focus: [x, y] point to zoom on, 0–1 across/down the screen
#              A clip without segments uses `shot` (and `speed`) whole.
#   beats:     headline text over time; `at` is seconds into the clip. The
#              first is the hook (bigger). Keep each to a few words.
#   caption_y: full layout: where the caption pills sit, px from the top of
#              the 1920 frame (default 420; ~1380 sits over the keyboard).
#              A beat can set its own `y`.
#
# Zoom only on photos: any punch-in on a text screen crops the words.
#   caption:   post text, written to <id>.txt with the hashtags.
#
# The videos are silent on purpose: add the song from the platform's own
# sound library when you post (a song baked into the upload can get muted).

hashtags: "#musicjournal #nostalgia #songsthatremindme #journaling #iphoneapps"
end_card:
  title: "Soundtracks"
  line: "Free on the App Store"
  seconds: 2

clips:
  # Journal → the wedding moment: both photos, then who was there.
  - id: wedding-song
    layout: full
    palette: light
    segments:
      - { shot: open-moment, from: 0, to: 1.4 }
      - { shot: open-moment, from: 1.6, to: 4.6, speed: 1.2 }
      - { shot: open-moment, from: 5.0, to: 6.8 }
      - { shot: open-moment, from: 13.6, to: 15.6 }
    beats:
      - { at: 0, text: "The song that ends\nevery wedding" }
      - { at: 2.2, text: "Saved with the photos" }
      - { at: 5.7, text: "And who was there", y: 1250 }
    caption: "Every wedding. Every time. What's yours?"

  # Rediscover → search "Dad" → the truck.
  - id: dad-search
    layout: full
    palette: light
    segments:
      - { shot: rediscover-search, from: 0.5, to: 1.7 }
      - { shot: rediscover-search, from: 9.6, to: 11.8 }
      - { shot: rediscover-search, from: 15.6, to: 20.6, speed: 1.25 }
    beats:
      - { at: 0, text: "Type \"Dad\"", y: 1150 }
      - { at: 3.4, text: "Get every summer back" }
    caption: "Search your memories by the people in them."

  # The Journal flicked from this month back to 2019.
  - id: seven-years
    layout: phone
    palette: light
    segments:
      - { shot: journal-scroll, from: 0, to: 1.4 }
      - { shot: journal-scroll, from: 3.0, to: 24.0, speed: 3.5 }
      - { shot: journal-scroll, from: 24.5, to: 26.5 }
    beats:
      - { at: 0, text: "Every song\nis a bookmark" }
      - { at: 1.4, text: "Seven years of them" }
      - { at: 7.4, text: "Back to the first one" }
    caption: "What song would be on the first page of yours?"

  # Capture, cut down to the moments that matter.
  - id: ten-seconds
    layout: full
    palette: light
    caption_y: 1380
    segments:
      - { shot: capture, from: 0.2, to: 1.6 }
      - { shot: capture, from: 10.0, to: 11.8 }
      - { shot: capture, from: 14.8, to: 16.2 }
      - { shot: capture, from: 18.0, to: 21.2, speed: 1.3 }
      - { shot: capture, from: 24.8, to: 26.8 }
    beats:
      - { at: 0, text: "Saving a memory\ntakes 10 seconds" }
      - { at: 1.4, text: "Pick the song" }
      - { at: 4.6, text: "Write one line" }
      - { at: 7.1, text: "Done", y: 1250 }
    caption: "The easiest journal you'll ever keep."


  # ── Search → open: one memory each (shared flow: flows/_search-and-open.yaml).

  - id: snow
    layout: full
    palette: light
    segments:
      - { shot: search-snow, from: 1.0, to: 2.2 }
      - { shot: search-snow, from: 11.8, to: 13.6 }
      - { shot: search-snow, from: 18.0, to: 21.5, speed: 1.2 }
      - { shot: search-snow, from: 21.8, to: 23.4, zoom: 1.3, focus: [0.5, 0.2] }
    beats:
      - { at: 0, text: "POV: the song that\nsounds like snow", y: 1050 }
      - { at: 3.0, text: "Saved with the morning it belonged to" }
      - { at: 5.92, text: "Coffee. Snow. On repeat." }
    caption: "Which song sounds like winter to you?"

  - id: festival
    layout: full
    palette: light
    segments:
      - { shot: search-festival, from: 1.0, to: 2.2 }
      - { shot: search-festival, from: 12.0, to: 14.2 }
      - { shot: search-festival, from: 18.7, to: 22.2, speed: 1.2 }
      - { shot: search-festival, from: 22.5, to: 24.1, zoom: 1.3, focus: [0.5, 0.2] }
    beats:
      - { at: 0, text: "The song that took\nher whole voice", y: 1050 }
      - { at: 3.4, text: "Day three of the festival" }
      - { at: 6.32, text: "Some songs you scream, not sing" }
    caption: "What's the song you lost your voice to?"

  - id: denver
    layout: full
    palette: light
    segments:
      - { shot: search-denver, from: 1.0, to: 2.2 }
      - { shot: search-denver, from: 10.0, to: 12.2 }
      - { shot: search-denver, from: 17.9, to: 20.4, speed: 1.0 }
      - { shot: search-denver, from: 20.4, to: 22.0, zoom: 1.3, focus: [0.5, 0.2] }
    beats:
      - { at: 0, text: "The last night before\nhe moved away", y: 1050 }
      - { at: 3.4, text: "Nobody said it" }
      - { at: 5.9, text: "Everybody sang louder" }
    caption: "What song do you associate with a goodbye?"

  - id: front-row
    layout: full
    palette: light
    segments:
      - { shot: search-front-row, from: 9.5, to: 10.7 }
      - { shot: search-front-row, from: 23.0, to: 25.2 }
      - { shot: search-front-row, from: 29.8, to: 33.0, speed: 1.2 }
      - { shot: search-front-row, from: 33.3, to: 34.9, zoom: 1.3, focus: [0.5, 0.2] }
    beats:
