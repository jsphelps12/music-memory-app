# Short videos for TikTok / Reels / Shorts, built from recorded shots of the
# app (marketing/videos/flows/<shot>.yaml) with scripts/video/make.py.
#
# Two kinds of clip:
#
# STORY (what we post): `slides`, in order. A slide is a real-life photo
# (`photo:` a file in photos/, `seconds:`) or a piece of a shot (`shot:` with
# from/to/speed/zoom/focus as below), each with its `text` (optional `y` for
# where it sits, `size` for the type size, default 72). The format faceless
# app accounts use: life first, a specific mid-story line in TikTok's own
# caption look (white, black outline, upper middle, casual lowercase), the app
# as the payoff, its name on the last slide. No end card. Also exports the
# slides as JPGs (out/<id>-slides/) for a Photo Mode carousel.
#
# MONTAGE (the first attempt, kept for reference): `segments` cut together
# with caption beats over them, then an end card.
#
#   id:        output name (marketing/videos/out/<id>.mp4 / .jpg / .txt)
#   layout:    phone (the screen in a bezel under a serif headline) or full
#              (the screen fills the frame, captions as pills on top)
#   palette:   light | dark (the shots record in that appearance too)
#   segments:  the cuts, in order. Each:
#                shot:  flow to record (or input: a recording of your own,
#                       e.g. from your phone, with trim: seconds to skip)
#                from / to: seconds into the shot, counted from when it
#                       starts moving (default: all of it)
#                speed: playback speed (default 1)
#                zoom:  punch in (1 = whole screen, 1.6 = 60% closer)
#                focus: [x, y] point to zoom on, 0–1 across/down the screen
#              A clip without segments uses `shot` (and `speed`) whole.
#   beats:     headline text over time; `at` is seconds into the clip. The
#              first is the hook (bigger). Keep each to a few words.
#   caption_y: full layout: where the caption pills sit, px from the top of
#              the 1920 frame (default 420; ~1380 sits over the keyboard).
#              A beat can set its own `y`.
#
# Zoom only on photos: any punch-in on a text screen crops the words.
#   caption:   post text, written to <id>.txt with the hashtags.
#
# The videos are silent on purpose: add the song from the platform's own
# sound library when you post (a song baked into the upload can get muted).

hashtags: "#musicjournal #nostalgia #songsthatremindme #journaling #iphoneapps"
end_card:
