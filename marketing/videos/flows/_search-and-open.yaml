# Shared by the search-* shots: Rediscover → search QUERY → open RESULT, let
# the photos play (the carousel advances by itself), then scroll down to who
# was there. Callers pass QUERY and RESULT (a song title) as env.
appId: com.joshuaphelps.musicmemory.preview
---
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 800
    optional: true
- tapOn: "Rediscover"
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 1500
    optional: true
- tapOn: "Search songs, artists, reflections"
# Typing can drop its first letters right after the keyboard rises (see
# .maestro/subflows/sign-in-form.yaml); retry until the result shows. Rows
# read out as one label ("Holocene Bon Iver …"), so match by prefix.
- retry:
    maxRetries: 3
    commands:
      - waitForAnimationToEnd
      - eraseText
      - inputText: ${QUERY}
      - extendedWaitUntil:
          visible: ".*${RESULT}.*"
          timeout: 8000
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 1500
    optional: true
- tapOn: ".*${RESULT}.*"
- extendedWaitUntil:
    visible:
      id: "moment-more"
    timeout: 15000
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 7000
    optional: true
- swipe:
    start: "50%, 80%"
    end: "50%, 45%"
    duration: 1500
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 2500
    optional: true
